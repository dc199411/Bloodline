version: '3.9'
services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bloodline
      POSTGRES_USER: bloodline
      POSTGRES_PASSWORD: bloodline_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    command: anvil --fork-url ${BASE_RPC_URL:-https://mainnet.base.org} --chain-id 8453 --port 8545
    ports:
      - "8545:8545"

  api:
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://bloodline:bloodline_dev@postgres:5432/bloodline
      - REDIS_URL=redis://redis:6379
      - BASE_RPC_URL=http://anvil:8545
    depends_on:
      - postgres
      - redis
      - anvil

  miniapp:
    build:
      context: ../
      dockerfile: apps/miniapp/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - api

volumes:
  postgres_data:
